<text x="1210" y="538" text-anchor="end" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="3" fill="#c9a24a">OPEN THE REPOSITORY  &#8594;</text>
