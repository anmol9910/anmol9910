<text x="640" y="62" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="14" letter-spacing="7" fill="#e8601c">QUANT  AND  RISK</text>
<text x="640" y="112" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="44" fill="url(#gold)">Monte Carlo Portfolio Manager</text>
<text x="640" y="140" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9a8d79">github.com/anmol9910/montecarlo-portfolio-management-model</text>
<text x="640" y="170" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#eadfc4">See thousands of possible futures for your portfolio, not one forecast.</text>
<g transform="translate(640 188)"><rect x="-300" y="-1" width="270" height="2" fill="url(#goldH)"/><rect x="30" y="-1" width="270" height="2" fill="url(#goldH)"/><path d="M0,-7 L7,0 L0,7 L-7,0Z" fill="#c9a24a"/></g>
<text x="70" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHY IT EXISTS</text>
<text x="460" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHAT IT SOLVES</text>
<text x="850" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">HIGHLIGHTS</text>
<text x="70" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">A single forecast hides risk. Investors need</text>
<text x="70" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">to see the range of outcomes a portfolio can</text>
<text x="70" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">reach so they can plan for the bad cases</text>
<text x="70" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">too.</text>
<text x="460" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Gives probabilistic forecasts of portfolio</text>
<text x="460" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">performance under different market</text>
<text x="460" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">conditions, so users can judge risk and</text>
<text x="460" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">choose how to allocate before investing.</text>
<path d="M854,241 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Optimise for maximum Sharpe ratio or</text>
<text x="870" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">a balanced portfolio</text>
<path d="M854,293 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="302" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Weights or dollar amounts per stock,</text>
<text x="870" y="324" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">with ticker autocomplete</text>
<path d="M854,345 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="354" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Stooq fallback in the data loader and</text>
<text x="870" y="376" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">unit tests included</text>
<text x="70" y="420" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">ARSENAL</text>
