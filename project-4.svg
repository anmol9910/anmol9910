<text x="640" y="62" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="14" letter-spacing="7" fill="#e8601c">FINANCIAL  RISK  ANALYSIS</text>
<text x="640" y="112" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="44" fill="url(#gold)">S&amp;P 500 Stress Testing</text>
<text x="640" y="140" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9a8d79">github.com/anmol9910/Stress-testing-financial-model-for-portfolio</text>
<text x="640" y="170" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#eadfc4">How does a portfolio survive a market crash?</text>
<g transform="translate(640 188)"><rect x="-300" y="-1" width="270" height="2" fill="url(#goldH)"/><rect x="30" y="-1" width="270" height="2" fill="url(#goldH)"/><path d="M0,-7 L7,0 L0,7 L-7,0Z" fill="#c9a24a"/></g>
<text x="70" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHY IT EXISTS</text>
<text x="460" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHAT IT SOLVES</text>
<text x="850" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">HIGHLIGHTS</text>
<text x="70" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Markets do not move gently forever. I wanted</text>
<text x="70" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">to measure how a portfolio holds up against</text>
<text x="70" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">severe shocks and which industries carry the</text>
<text x="70" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">most risk.</text>
<text x="460" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Simulates a 30 percent crash and a 10</text>
<text x="460" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">percent interest rate shock, compares</text>
<text x="460" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">stressed returns with normal ones, and shows</text>
<text x="460" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">which sectors move together for better</text>
<text x="460" y="338" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">diversification.</text>
<path d="M854,241 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Merged 500+ company CSV files into</text>
<text x="870" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">one dataset of five years</text>
<path d="M854,293 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="302" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Sector comparison of price, volume,</text>
<text x="870" y="324" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">returns and volatility</text>
<path d="M854,345 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="354" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Second notebook calculates VaR and</text>
<text x="870" y="376" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">CVaR</text>
<text x="70" y="420" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">ARSENAL</text>
