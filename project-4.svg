<g class="chip" style="animation-delay:0.30s"><rect x="622.6" y="434" width="102" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M634.6,446 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="646.6" y="455.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Jupyter</text></g>
<g class="chip" style="animation-delay:0.36s"><rect x="734.9000000000001" y="434" width="191" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M746.9000000000001,446 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="758.9000000000001" y="455.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Kaggle (IEX data)</text></g>
