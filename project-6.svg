<text x="640" y="62" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="14" letter-spacing="7" fill="#e8601c">DATA ANALYTICS  AND  BI</text>
<text x="640" y="112" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="44" fill="url(#gold)">Customer Churn Analysis</text>
<text x="640" y="140" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9a8d79">github.com/anmol9910/Customer-Churn-Analysis</text>
<text x="640" y="170" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#eadfc4">Why are credit card customers leaving, and how do we keep them?</text>
<g transform="translate(640 188)"><rect x="-300" y="-1" width="270" height="2" fill="url(#goldH)"/><rect x="30" y="-1" width="270" height="2" fill="url(#goldH)"/><path d="M0,-7 L7,0 L0,7 L-7,0Z" fill="#c9a24a"/></g>
<text x="70" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHY IT EXISTS</text>
<text x="460" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHAT IT SOLVES</text>
<text x="850" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">HIGHLIGHTS</text>
<text x="70" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">A bank case study: more and more customers</text>
<text x="70" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">were leaving the credit card service and the</text>
<text x="70" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">bank needed to know the reasons and a plan</text>
<text x="70" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">to stop it.</text>
<text x="460" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Finds who churns and why, then recommends</text>
<text x="460" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">targeted retention campaigns, from loyalty</text>
<text x="460" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">programs for long-term customers to credit</text>
<text x="460" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">counselling for low-income cardholders.</text>
<path d="M854,241 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Churn rate of 16 percent, about one</text>
<text x="870" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">in six customers</text>
<path d="M854,293 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="302" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Churned customers spent $3,095 on</text>
<text x="870" y="324" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">average against $4,404 overall</text>
<path d="M854,345 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="354" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Pareto view: about 20 percent of</text>
<text x="870" y="376" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">churners drive 80 percent of churn</text>
<text x="70" y="420" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">ARSENAL</text>
