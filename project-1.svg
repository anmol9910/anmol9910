<g class="chip" style="animation-delay:0.42s"><rect x="900.6000000000001" y="412" width="156" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M912.6000000000001,424 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="924.6000000000001" y="433.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Tavily Search</text></g>
<g class="chip" style="animation-delay:0.48s"><rect x="1066.3000000000002" y="412" width="102" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M1078.3000000000002,424 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="1090.3000000000002" y="433.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Uvicorn</text></g>
<text x="1210" y="474" text-anchor="end" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="3" fill="#c9a24a">OPEN THE REPOSITORY  &#8594;</text>
