<text x="640" y="62" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="14" letter-spacing="7" fill="#e8601c">GENAI  AND  AGENTS</text>
<text x="640" y="112" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="44" fill="url(#gold)">Synapse Agent Fabric</text>
<text x="640" y="140" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9a8d79">github.com/anmol9910/Synapse-Agent-Fabric</text>
<text x="640" y="170" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#eadfc4">A framework for building AI agents that think, search and answer.</text>
<g transform="translate(640 188)"><rect x="-300" y="-1" width="270" height="2" fill="url(#goldH)"/><rect x="30" y="-1" width="270" height="2" fill="url(#goldH)"/><path d="M0,-7 L7,0 L0,7 L-7,0Z" fill="#c9a24a"/></g>
<text x="70" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHY IT EXISTS</text>
<text x="460" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHAT IT SOLVES</text>
<text x="850" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">HIGHLIGHTS</text>
<text x="70" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Most chatbots are one fixed prompt on one</text>
<text x="70" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">model. I wanted a framework where anyone can</text>
<text x="70" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">create a custom agent, choose the LLM behind</text>
<text x="70" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">it and give it live web access.</text>
<text x="460" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">LLMs go out of date and lock you into one</text>
<text x="460" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">provider. Synapse agents search the web in</text>
<text x="460" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">real time with Tavily and switch between</text>
<text x="460" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Groq (Llama3, Gemma) and OpenAI (GPT-4o)</text>
<text x="460" y="338" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">from the UI.</text>
<path d="M854,241 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">ReAct agent built with LangGraph that</text>
<text x="870" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">reasons and uses tools</text>
<path d="M854,293 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="302" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Three tiers: Streamlit UI, FastAPI</text>
<text x="870" y="324" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">backend and an AI core</text>
<path d="M854,345 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="354" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Custom persona through system prompts</text>
<text x="70" y="398" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">ARSENAL</text>
