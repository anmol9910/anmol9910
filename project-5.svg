<g class="chip" style="animation-delay:0.30s"><rect x="800.6000000000001" y="434" width="93" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M812.6000000000001,446 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="824.6000000000001" y="455.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Pandas</text></g>
<g class="chip" style="animation-delay:0.36s"><rect x="904.0000000000001" y="434" width="84" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M916.0000000000001,446 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="928.0000000000001" y="455.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">NumPy</text></g>
<g class="chip" style="animation-delay:0.42s"><rect x="998.5000000000001" y="434" width="129" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M1010.5000000000001,446 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="1022.5000000000001" y="455.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Matplotlib</text></g>
<g class="chip" style="animation-delay:0.48s"><rect x="70" y="476" width="102" height="32" rx="4" fill="#120d09" stroke="#7a5c22" stroke-width="1.2"/><path d="M82,488 l4,4 l-4,4 l-4,-4Z" fill="#e8601c"/><text x="94" y="497.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#eadfc4">Seaborn</text></g>
<text x="1210" y="538" text-anchor="end" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="3" fill="#c9a24a">OPEN THE REPOSITORY  &#8594;</text>
