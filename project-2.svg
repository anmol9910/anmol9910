<text x="640" y="62" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="14" letter-spacing="7" fill="#e8601c">PRODUCT  RESEARCH  WITH  AI</text>
<text x="640" y="112" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="44" fill="url(#gold)">AI Product Inventor</text>
<text x="640" y="140" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9a8d79">github.com/anmol9910/ai-product-inventor</text>
<text x="640" y="170" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#eadfc4">Finds real unmet needs from live data, then invents the product.</text>
<g transform="translate(640 188)"><rect x="-300" y="-1" width="270" height="2" fill="url(#goldH)"/><rect x="30" y="-1" width="270" height="2" fill="url(#goldH)"/><path d="M0,-7 L7,0 L0,7 L-7,0Z" fill="#c9a24a"/></g>
<text x="70" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHY IT EXISTS</text>
<text x="460" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">WHAT IT SOLVES</text>
<text x="850" y="226" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">HIGHLIGHTS</text>
<text x="70" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Product ideas are cheap. The hard part is</text>
<text x="70" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">knowing which market gap is a real</text>
<text x="70" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">opportunity and which is wishful thinking.</text>
<text x="70" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Built with the #8NPD team.</text>
<text x="460" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Proves the need exists before proposing</text>
<text x="460" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">anything. It scans Amazon India, Flipkart</text>
<text x="460" y="294" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">and Reddit, finds recurring complaints and</text>
<text x="460" y="316" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">turns them into data-backed product</text>
<text x="460" y="338" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">concepts.</text>
<path d="M854,241 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="250" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">6 to 8 concepts per category, each</text>
<text x="870" y="272" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">with quotes from real reviews</text>
<path d="M854,293 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="302" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Scores for feasibility, opportunity</text>
<text x="870" y="324" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">and novelty, plus market size</text>
<path d="M854,345 l5,5 l-5,5 l-5,-5Z" fill="#e8601c"/>
<text x="870" y="354" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-size="16" fill="#eadfc4">Live scraping, deployed on Render</text>
<text x="70" y="398" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif" font-weight="700" font-size="15" letter-spacing="4" fill="#c9a24a">ARSENAL</text>
